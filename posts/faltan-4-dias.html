<!doctype html><html lang="es"><head><meta charset="utf-8"><style>
@font-face{font-family:"PenGram";src:url(../brand/fonts/BNPenAndGram-Light.otf);font-weight:300}
@font-face{font-family:"PenGram";src:url(../brand/fonts/BNPenAndGram-Bold.otf);font-weight:700}
:root{--vino:#741420;--beige:#b09a86;--claro:#f1e9e0}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;position:relative;font-family:"PenGram",sans-serif}
.k{font-weight:700;font-size:26px;letter-spacing:.42em;padding-left:.42em;text-transform:uppercase}
.n{font-weight:700;font-size:112px;line-height:1;letter-spacing:.14em;padding-left:.14em;text-transform:uppercase;margin-top:30px}
.p{font-weight:700;font-size:23px;line-height:1.7;letter-spacing:.3em;padding-left:.3em;text-transform:uppercase;margin-top:22px}
.t{font-weight:300;font-size:36px;line-height:1.35;margin-top:44px}
.d{font-weight:700;font-size:22px;letter-spacing:.34em;padding-left:.34em;text-transform:uppercase;margin-top:36px}
.s{font-weight:300;font-size:19px;letter-spacing:.24em;padding-left:.24em;text-transform:uppercase}
.logos{display:flex;align-items:center;gap:26px}.logos .alma{height:56px}.logos .div{width:1.5px;height:58px}.logos .sym{height:66px}
body{background:var(--claro);color:var(--vino);text-align:center}
.top{position:absolute;top:56px;left:0;right:0;display:flex;justify-content:center}
.arch{position:absolute;top:170px;left:50%;transform:translateX(-50%);width:460px;height:560px;border-radius:230px 230px 0 0;overflow:hidden}
.arch div{width:100%;height:100%;background:url(foto-dia4.jpg) 50% 30%/cover;filter:brightness(1.25)}
.txt{position:absolute;left:80px;right:80px;top:770px}
.k,.p,.d{color:var(--beige)} .n{font-size:96px;margin-top:22px} .t{margin-top:34px;font-size:32px} .d{margin-top:28px}
.s{position:absolute;bottom:44px;left:0;right:0;color:var(--beige)}
</style></head><body>
<div class="top"><div class="logos"><img class="alma" src="../brand/logos/logo-vino.png"><span class="div" style="background:rgba(116,20,32,.4)"></span><img class="sym" src="../brand/logos/simbolo-vino.png"></div></div>
<div class="arch"><div></div></div>
<div class="txt"><div class="k">Faltan</div><div class="n">4 días</div>
<div class="p">para vivir la experiencia<br>más inolvidable</div>
<div class="t">Empieza a preparar tu cuerpo,<br>tu corazón y tu intención.</div>
<div class="d">Prepárate para despertar</div></div>
<div class="s">Mujeres salvajes · Retiro femenino</div></body></html>
