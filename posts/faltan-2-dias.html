<!doctype html><html lang="es"><head><meta charset="utf-8"><style>
@font-face{font-family:"PenGram";src:url(../brand/fonts/BNPenAndGram-Light.otf);font-weight:300}
@font-face{font-family:"PenGram";src:url(../brand/fonts/BNPenAndGram-Bold.otf);font-weight:700}
:root{--vino:#741420;--beige:#b09a86;--claro:#f1e9e0}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;position:relative;font-family:"PenGram",sans-serif}

.logos{display:flex;align-items:center;gap:26px}.logos .alma{height:56px}.logos .div{width:1.5px;height:58px}.logos .sym{height:66px}
body{background:var(--beige);color:#fff}
.ph{position:absolute;left:0;top:0;bottom:0;width:500px;background:url(foto-dia2.jpg) 40% 50%/cover;filter:brightness(1.2)}
.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(116,20,32,0) 60%,rgba(116,20,32,.35))}
.col{position:absolute;left:500px;right:0;top:0;bottom:0;padding:70px 56px 52px;display:flex;flex-direction:column;align-items:center;text-align:center}
.mid{margin-top:auto;margin-bottom:auto}

<div class="ph"></div>
