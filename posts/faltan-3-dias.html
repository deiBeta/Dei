<!doctype html><html lang="es"><head><meta charset="utf-8"><style>
@font-face{font-family:"PenGram";src:url(../brand/fonts/BNPenAndGram-Light.otf);font-weight:300}
@font-face{font-family:"PenGram";src:url(../brand/fonts/BNPenAndGram-Bold.otf);font-weight:700}
@font-face{font-family:"Aire";src:url(../brand/fonts/Aire-Bold-Italic-Pro.ttf)}
:root{--vino:#741420;--beige:#b09a86}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;position:relative;background:var(--vino);font-family:"PenGram",sans-serif;color:#fff}
.photo{position:absolute;inset:0;background:url(foto-dia3.jpg) 50% 8%/cover no-repeat;filter:brightness(1.2)}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(116,20,32,0) 30%,rgba(116,20,32,.2) 42%,rgba(116,20,32,.5) 52%,rgba(116,20,32,.78) 60%,rgba(116,20,32,.93) 70%,#741420 84%)}
.logos{position:absolute;top:64px;left:72px;display:flex;align-items:center;gap:30px}
.logos .alma{height:62px}.logos .div{width:1.5px;height:64px;background:rgba(176,154,134,.6)}.logos .sym{height:74px}
.txt{position:absolute;left:90px;right:90px;bottom:60px;text-align:center}
.k{font-weight:700;font-size:28px;letter-spacing:.42em;padding-left:.42em;text-transform:uppercase;color:var(--beige)}
.n{font-weight:700;font-size:118px;line-height:1;letter-spacing:.14em;padding-left:.14em;text-transform:uppercase;color:var(--beige);margin-top:40px}
.n small{font-size:84px}
.p{font-weight:700;font-size:26px;line-height:1.7;letter-spacing:.3em;padding-left:.3em;text-transform:uppercase;color:var(--beige);margin-top:22px}
.t{font-weight:300;font-size:40px;line-height:1.35;margin-top:50px}
.d{margin-top:40px;font-weight:700;font-size:24px;letter-spacing:.34em;text-transform:uppercase;color:var(--beige)}
.s{margin-top:110px;font-weight:300;font-size:20px;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.7)}
</style></head><body>
<div class="photo"></div><div class="shade"></div>
<div class="logos"><img class="alma" src="../brand/logos/logo-taupe.png"><span class="div"></span><img class="sym" src="../brand/logos/simbolo-taupe.png"></div>
<div class="txt">
  <div class="k">Faltan</div>
  <div class="n">3 días</div>
  <div class="p">para vivir la experiencia<br>más inolvidable</div>
  <div class="t">¿Estás lista para llevar<br>la sexualidad a otro nivel?</div>
  <div class="d">Despierta tu feminidad</div>
  <div class="s">Mujeres salvajes · Retiro femenino</div>
</div>
</body></html>
