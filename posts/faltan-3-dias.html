<!doctype html><html lang="es"><head><meta charset="utf-8"><style>
@font-face{font-family:"PenGram";src:url(../brand/fonts/BNPenAndGram-Light.otf);font-weight:300}
@font-face{font-family:"PenGram";src:url(../brand/fonts/BNPenAndGram-Bold.otf);font-weight:700}
@font-face{font-family:"Aire";src:url(../brand/fonts/Aire-Bold-Italic-Pro.ttf)}
:root{--vino:#741420;--beige:#b09a86}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;position:relative;background:var(--vino);font-family:"PenGram",sans-serif;color:#fff}
.photo{position:absolute;inset:0;background:url(foto-3dias.jpg) 62% 30%/cover no-repeat}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(116,20,32,0) 8%,rgba(116,20,32,.25) 28%,rgba(116,20,32,.55) 44%,rgba(116,20,32,.8) 58%,rgba(116,20,32,.94) 72%,#741420 88%)}

.n{font-family:"Aire";font-size:150px;line-height:1;margin-top:18px}
.n small{font-size:84px}
.p{font-weight:300;font-size:30px;line-height:1.4;margin-top:20px}
.t{font-weight:300;font-size:40px;line-height:1.35;margin-top:50px}
.d{margin-top:40px;font-weight:700;font-size:24px;letter-spacing:.34em;text-transform:uppercase;color:var(--beige)}
.s{margin-top:48px;font-weight:300;font-size:20px;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.7)}
</style></head><body>
<div class="photo"></div><div class="shade"></div>
<div class="logos"><img class="alma" src="../brand/logos/logo-taupe.png"><span class="div"></span><img class="sym" src="../brand/logos/simbolo-taupe.png"></div>
<div class="txt">
  <div class="k">Faltan</div>
  <div class="n">3 <small>días</small></div>
  <div class="p">para vivir la experiencia más inolvidable de tu vida</div>
  <div class="t">¿Estás lista para llevar<br>la sexualidad a otro nivel?</div>
  <div class="d">Despierta tu feminidad</div>
  <div class="s">Mujeres salvajes · Retiro femenino</div>
</div>
</body></html>
